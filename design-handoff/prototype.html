<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Tradelink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600&display=swap">
<style>
/* Layout concept: a super-app style ordering home. A green hero, tap-first service tiles and product cards, with a white rail that folds into a bottom tab bar when the app is narrow. */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --sunken: #F1F7F4; --line: #DCE8E2;
  --ink: #0F2A20; --muted: #54695F; --accent: #0B4F37; --on-accent: #FFFFFF; --accent-soft: #E3F0E9;
  --nav: #FFFFFF; --nav-ink: #0F2A20; --nav-muted: #5F7469; --nav-active: #E3F0E9;
  --hero: #0A3A29; --hero-2: #0F5239; --on-hero: #FFFFFF; --on-hero-2: #CFE5DA;
  --good: #0B6B47; --good-soft: #E3F0E9; --warn: #8F5600; --warn-soft: #FDF0D5; --bad: #B4302F; --bad-soft: #FCE6E4;
  --blue: #0B4F37; --blue-soft: #E3F0E9; --plum: #0B4F37; --plum-soft: #E3F0E9;
  --shadow: 0 1px 2px rgba(15, 42, 32, .05), 0 3px 10px rgba(15, 42, 32, .05); --scrim: rgba(10, 58, 41, .5);
  --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1211; --surface: #1B201E; --sunken: #141817; --line: #303734;
  --ink: #F4F6F5; --muted: #A8B2AD; --accent: #3DDC97; --on-accent: #06291B; --accent-soft: #20392E;
  --nav: #151918; --nav-ink: #F4F6F5; --nav-muted: #A0AAA5; --nav-active: #20392E;
  --hero: #0F4A34; --hero-2: #14644A; --on-hero: #FFFFFF; --on-hero-2: #CFE5DA;
  --good: #5FE0A8; --good-soft: #1C3A2D; --warn: #F2BC62; --warn-soft: #3B2D14; --bad: #F59A95; --bad-soft: #452322;
  --blue: #3DDC97; --blue-soft: #20392E; --plum: #3DDC97; --plum-soft: #20392E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .25); --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1211; --surface: #1B201E; --sunken: #141817; --line: #303734;
  --ink: #F4F6F5; --muted: #A8B2AD; --accent: #3DDC97; --on-accent: #06291B; --accent-soft: #20392E;
  --nav: #151918; --nav-ink: #F4F6F5; --nav-muted: #A0AAA5; --nav-active: #20392E;
  --hero: #0F4A34; --hero-2: #14644A; --on-hero: #FFFFFF; --on-hero-2: #CFE5DA;
  --good: #5FE0A8; --good-soft: #1C3A2D; --warn: #F2BC62; --warn-soft: #3B2D14; --bad: #F59A95; --bad-soft: #452322;
  --blue: #3DDC97; --blue-soft: #20392E; --plum: #3DDC97; --plum-soft: #20392E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .25); --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body);
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 1.6rem/1.15 var(--display); text-wrap: balance; }
h2 { font: 600 1.08rem/1.25 var(--display); text-wrap: balance; }
.mono { font-family: var(--mono); font-size: .86em; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.num { font-variant-numeric: tabular-nums; }

/* Demo controls sit outside the app itself */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: .84rem; color: var(--muted); }
.demo-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.demo select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 170px; }
.demo .reset { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 5px 10px; color: var(--muted); }
@media (max-width: 860px) { .device-group { display: none; } }

.stage { flex: 1; min-height: 560px; display: flex; justify-content: center; align-items: center; min-width: 0; }
.frame {
  container: app / inline-size; position: relative; overflow: hidden; width: 100%; height: 100%; max-width: 100%;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; transition: width .25s ease;
}
.frame[data-device="tablet"] { width: 820px; }
.frame[data-device="phone"] { width: 390px; max-height: 800px; border-radius: 26px; border-width: 5px; border-color: var(--nav); }
@media (max-width: 860px) { .frame[data-device] { width: 100%; max-height: none; border-radius: 12px; border-width: 1px; border-color: var(--line); } }

.shell { height: 100%; display: grid; grid-template: "top" auto "main" minmax(0, 1fr) "nav" auto / minmax(0, 1fr); }
.top { grid-area: top; background: var(--nav); color: var(--nav-ink); padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font: 700 1.14rem/1 var(--display); display: flex; align-items: center; gap: 8px; }
.brand svg { width: 20px; height: 20px; }
.top-org { font-size: .78rem; color: var(--nav-muted); text-align: right; min-width: 0; overflow-wrap: anywhere; }
.nav { grid-area: nav; background: var(--nav); display: flex; padding: 4px; overflow-x: auto; min-width: 0; }
.nav button { position: relative; flex: 1 0 68px; min-width: 0; border: 0; background: none; color: var(--nav-muted); border-radius: 8px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; }
.nav button[aria-current="page"] { background: var(--nav-active); color: #FFFFFF; }
.nav svg { width: 20px; height: 20px; flex: none; }
.count { background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 0 6px; font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.nav .count { position: absolute; top: 2px; right: 6px; }
.who { display: none; }
.main { grid-area: main; overflow: auto; padding: 16px 14px 28px; }
.page { max-width: 1060px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-direction: column; gap: 3px; }

@container app (min-width: 760px) {
  .shell { grid-template: "top main" auto "nav main" minmax(0, 1fr) "who main" auto / 228px minmax(0, 1fr); }
  .top { padding: 18px 16px 12px; }
  .top-org { display: none; }
  .nav { flex-direction: column; gap: 3px; padding: 6px 10px; overflow: hidden auto; }
  .nav button { flex: none; flex-direction: row; gap: 10px; padding: 9px 10px; font-size: .92rem; text-align: left; }
  .nav .count { position: static; margin-left: auto; }
  .who { display: block; grid-area: who; background: var(--nav); color: var(--nav-ink); padding: 12px 16px 16px; font-size: .84rem; }
  .who span { display: block; color: var(--nav-muted); font-size: .78rem; }
  .main { padding: 24px 24px 36px; }
}

/* Shared pieces */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { width: 100%; padding: 11px 14px; font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.plain { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@container app (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile b { display: block; font: 700 1.5rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
.tile.alert b { color: var(--warn); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tools .input { flex: 1 1 200px; width: auto; min-width: 0; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: .84rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* Tables turn into stacked records when narrow */
.tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .73rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
.prod b { font-weight: 600; display: block; }
.bar { height: 5px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin-top: 4px; min-width: 56px; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }
.receive { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.receive input { width: 76px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); gap: 8px 12px; }
.metrics div { min-width: 0; }
.metrics span { display: block; font-size: .74rem; color: var(--muted); }
.metrics b { display: block; font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.order .bar { margin-top: 0; }
.order-top { flex-wrap: nowrap; }
.order-who { flex: 1; }
.order-top > .pill { flex: none; }
@container app (max-width: 640px) {
  .stack thead { display: none; }
  .stack tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; padding: 12px; border-bottom: 1px solid var(--line); }
  .stack tr:last-child { border-bottom: 0; }
  .stack td { display: block; padding: 0; border: 0; text-align: left; min-width: 0; }
  .stack td.full { grid-column: 1 / -1; }
  .stack td[data-label]::before { content: attr(data-label); display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
}

/* New order */
.compose textarea { width: 100%; min-height: 150px; resize: vertical; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 400 .92rem/1.5 var(--mono); }
.compose-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.compose-actions .primary { flex: 1 1 170px; }
.review { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container app (min-width: 980px) { .review { grid-template-columns: minmax(0, 1fr) 300px; } }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.line.check { border-color: var(--warn); }
.line.none, .line.over { border-color: var(--bad); }
.line-src { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; }
.line-src .mono { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.line select { width: 100%; min-width: 0; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
.line-info { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }
.line-info .err { color: var(--bad); font-weight: 600; }
.stepper { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--sunken); width: 30px; }
.stepper input { width: 46px; border: 0; background: none; text-align: center; padding: 6px 0; appearance: textfield; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.rm { border: 0; background: none; color: var(--muted); font-size: .8rem; text-decoration: underline; padding: 0; }
.split { display: flex; flex-direction: column; gap: 6px; }
.split div { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; }
.split .tot { border-top: 1px solid var(--line); padding-top: 7px; font-weight: 600; }
.blocker { font-size: .83rem; color: var(--warn); }
.note { font-size: .8rem; color: var(--muted); }

/* Orders */
.orders { display: flex; flex-direction: column; gap: 10px; }
.order { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.order-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; }
.order-items { display: flex; flex-direction: column; gap: 2px; font-size: .9rem; }
.order-items div { display: flex; justify-content: space-between; gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: .72rem; color: var(--muted); }
.steps span { border-top: 3px solid var(--line); padding-top: 4px; }
.steps span.done { border-color: var(--good); color: var(--ink); }
.order-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.order-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container app (min-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.feed { display: flex; flex-direction: column; }
.feed > div { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .88rem; display: flex; justify-content: space-between; gap: 10px; }
.feed > div:last-child { border-bottom: 0; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); }

/* Add to catalogue */
.cat-form { grid-column: 1 / -1; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); min-width: 0; }
.field .input { color: var(--ink); font-size: .92rem; }
.form-err { color: var(--bad); font-size: .84rem; font-weight: 600; }
.form-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: .72rem; color: var(--warn); font-weight: 600; }

/* Admin records */
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
.title-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.title-name { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.profile { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 16px; margin: 0; }
.profile dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.profile dd { margin: 0; overflow-wrap: anywhere; }
.rowlink { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-align: left; }
.attn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.attn.high { border-color: var(--bad); }
.attn.unread { border-color: var(--accent); }

/* Today, Ask and Insights */
.hero-plan { border-color: var(--accent); }
.todos { display: flex; flex-direction: column; gap: 10px; }
.todo { border-left: 3px solid var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 5px; }
.todo.warn { border-left-color: var(--warn); } .todo.bad { border-left-color: var(--bad); } .todo.good { border-left-color: var(--good); }
.warn-t { color: var(--warn); font-weight: 600; }
.row-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.count-in { width: 76px; text-align: right; padding: 4px 6px; }
.tgl { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tgl:last-child { border-bottom: 0; }
.tgl > span span { display: block; }
.tgl input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.plain { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
.wbars { display: flex; gap: 8px; align-items: flex-end; height: 170px; }
.wbars div { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.wbars i { display: block; width: 100%; max-width: 44px; background: var(--accent-soft); border-radius: 4px 4px 0 0; }
.wbars i.now { background: var(--accent); }
.wbars .wl { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: .9rem; }
.hbar i { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.hbar u { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.chatpage { max-width: 680px; min-height: 100%; }
.thread { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.um { align-self: flex-end; max-width: 82%; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 12px 12px 3px 12px; overflow-wrap: anywhere; }
.bm { align-self: flex-start; width: 100%; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
.cc { width: min(100%, 420px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.cc-h, .cc-l { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .9rem; }
.composer { position: sticky; bottom: -28px; background: var(--bg); padding-block: 8px; display: flex; flex-direction: column; gap: 7px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips .chip { flex: none; }
.send { display: flex; gap: 8px; }
.send .input { flex: 1; min-width: 0; }
@container app (min-width: 760px) { .composer { bottom: -36px; } }
.attn-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; }
.attn-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.attn-foot select { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); width: min(92%, 420px); background: var(--ink); color: var(--bg); padding: 9px 13px; border-radius: 9px; font-size: .88rem; text-align: center; z-index: 5; }

/* Tap-first app look */
[hidden] { display: none !important; }
body { -webkit-font-smoothing: antialiased; }
h1 { font-weight: 800; letter-spacing: -.02em; }
h2 { font-weight: 700; letter-spacing: -.01em; }
.frame { background: var(--bg); box-shadow: var(--shadow); border-color: var(--line); border-radius: 18px; }
.frame[data-device="phone"] { border-color: var(--line); }
.seg { border-radius: 999px; padding: 3px; }
.seg button { border-radius: 999px; font-weight: 600; }
.demo .reset, .demo select { border-radius: 999px; }
.top { background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); }

function kindOf(p) {

const UNITS = 'ctns?|cartons?|box(?:es)?|bags?|btls?|bottles?|tins?|cans?|pkts?|packets?|packs?|tubs?|trays?|kgs?';

function matchProducts(q) {

    if (p.aliases.some(a => q.includes(a))) return { p, score: 1 };
    const pt = new Set([...tokens(p.name), ...p.aliases.flatMap(tokens)]);
    return { p, score: qt.filter(t => pt.has(t)).length / qt.length * .9 };

  const hits = matchProducts(s);

function saveProduct() {

  if (!(price > 0) || price > 99999) { d.err = 'Enter a price above 0.'; return; }

const BUYER = 'b1';
const onOrder = pid => S.orders.filter(o => o.buyer === BUYER && OPEN.includes(o.status)).reduce((t, o) => t + o.items.filter(i => i.pid === pid).reduce((a, i) => a + i.qty, 0), 0);
const daysLeft = u => (u.have + onOrder(u.pid)) / u.use;
const cutoffOf = s => s.cutoff || 16;

function restockPlan() {
  if (!S.settings.lowStock) return [];
  return S.usuals.filter(u => daysLeft(u) < 3 && !S.skipped.includes(u.pid) && !P(u.pid).hidden).map(u => {
    const p = P(u.pid), want = Math.max(1, Math.ceil(u.use * 7 - u.have - onOrder(u.pid))), qty = Math.min(want, Math.max(1, avail(p)));
    return { ...u, want, qty, left: daysLeft(u) };
  });
}

function startPartial(id) { S.partial = id; }
function savePartial(id) {
  const o = S.orders.find(x => x.id === id), next = {};
  for (const i of o.items) {
    const n = Number(document.getElementById('pa-' + i.pid).value);
    if (!Number.isInteger(n) || n < 0 || n > i.qty) { toast(`Enter 0 to ${i.qty} for ${P(i.pid).name}.`); return; }

  o.items.forEach(i => {

      S.partials.unshift({ id: 'PA-' + S.nextPa++, oid: id, sid: o.sid, pid: i.pid, sent: next[i.pid], asked: i.qty, status: 'New', buyer: o.buyer });

function addInvoice(kind) {

/* ---------- Ask: rule-based stand-in for the assistant ---------- */
const CHIPS = ['What should I order?', "What's arriving today?", 'How much did I spend this week?', 'How much is cooking oil?', 'Which supplier is most reliable?', '2 ctn eggs and 5 tins evaporated milk'];
const cardOrder = o => `<div class="cc"><div class="cc-h"><b class="mono">${o.id}</b>${statusPill(o.status)}</div><p class="small muted">${esc(acct(o.sid).org)}</p>${o.items.map(i => `<div class="cc-l"><span>${i.qty} × ${esc(P(i.pid).name)}</span></div>`).join('')}<div class="cc-l"><span class="small muted">Total</span><b class="num">${money(total(o))}</b></div></div>`;
function reply(q) {
  const t = q.toLowerCase(), mine = S.orders.filter(o => o.buyer === BUYER);
  if (/(other|another) (shop|buyer|customer)|seaside|everyone'?s/.test(t)) return { text: `I can only see orders and prices for ${acct(BUYER).org}.` };
  const id = t.match(/ord-?\s*(\d+)/);
  if (id) { const o = mine.find(x => x.id === 'ORD-' + id[1]); return o ? { text: `Here is ${o.id}.`, html: cardOrder(o) } : { text: 'I cannot find that order on your account.' }; }
  if (/spen[dt]|budget/.test(t)) { const s = weekSpend(), b = S.settings.budget; return { text: `You have spent ${money(s)} this week, ${s > b ? money(s - b) + ' over' : money(b - s) + ' under'} your ${money(b)} budget.`, html: `<button class="btn" data-a="goto" data-v="insights">Open Insights</button>` }; }
  if (/arriv|deliver|coming/.test(t)) { const a = mine.filter(o => o.status === 'Out for delivery'); return a.length ? { text: `${plural(a.length, 'delivery')} on the way.`, html: a.map(cardOrder).join('') } : { text: 'Nothing is on the way right now.' }; }
  if (/running low|what should i order|need to order|\blow\b/.test(t)) { const p = restockPlan(); return p.length ? { text: `${plural(p.length, 'item')} will run out soon.`, html: `<div class="cc">${p.map(u => `<div class="cc-l"><span>${esc(P(u.pid).name)}</span><span class="small muted">${u.left.toFixed(1)} days left</span></div>`).join('')}</div><button class="btn primary" data-a="loadplan">Review and send</button>` } : { text: 'You have enough stock for the next few days.' }; }
  if (/usual|reorder|same as/.test(t)) return { text: 'I can load your usual items for you to review.', html: '<button class="btn primary" data-a="loadusual">Load my usual</button>' };
  if (/reliab|on time|best supplier|late/.test(t)) { const r = suppliers().filter(s => s.status === 'Active').sort((a, b) => (b.onTime || 0) - (a.onTime || 0))[0]; return { text: `${r.org} has your best record, at ${r.onTime}% on time.`, html: `<button class="btn" data-a="goto" data-v="insights">See all suppliers</button>` }; }
  if (/price|how much|cost/.test(t)) {
    const hit = matchProducts(t.replace(/price|how much|cost|is|of|the|does|what|\?/g, ' ').replace(/\s+/g, ' ').trim())[0];
    if (!hit) return { text: 'I could not find that product in the catalogue.' };
    const p = hit.p, u = S.usuals.find(x => x.pid === p.id);
    return { text: `${p.name} is ${money(p.price)} per ${p.unit}.`, html: `<div class="cc"><div class="cc-l"><span>Supplier</span><span>${esc(acct(p.sid).org)}</span></div><div class="cc-l"><span>Available</span><span class="num">${p.unconfirmed ? 'To confirm' : avail(p)}</span></div>${u ? `<div class="cc-l"><span>You last paid</span><span class="num">${money(u.last)}</span></div>` : ''}</div>` };
  }
  const lines = readOrder(q);
  if (lines.some(l => l.pid || l.options.length)) {
    S.chatDrafts.push(q);
    return { text: 'Here is what I read. Nothing has been sent.', html: `<div class="cc">${lines.map(l => `<div class="cc-l"><span>${l.pid ? `${l.qty} × ${esc(P(l.pid).name)}` : esc(l.raw)}</span><span class="small muted">${l.state === 'ok' ? 'Matched' : l.state === 'check' ? 'Check this' : 'Not found'}</span></div>`).join('')}</div><button class="btn primary" data-a="chatreview" data-id="${S.chatDrafts.length - 1}">Review order</button>` };
  }
  return { text: 'I did not catch that. Type your order as you would text a supplier, or ask about prices, deliveries or spending.' };
}
function sendChat(text) {
  const q = text.trim(); if (!q) return;
  S.chat.push({ from: 'me', text: q }); S.chatText = ''; S.typing = true; S.scrollChat = true; render();
  setTimeout(() => { S.typing = false; S.chat.push({ from: 'bot', ...reply(q) }); S.scrollChat = true; render(); }, 450);
}
function vAsk() {

    if (name.length < 2) { toast('Enter the operator name.'); return; }
    S.operators.push({ id: 'o' + S.nextOp++, name, team: document.getElementById('op-team').value, shift: document.getElementById('op-shift').value.trim() || 'Not set', status: 'Offline' });
    log('Added operator ' + name); toast(`${name} added.`);
  }
  if (a === 'manual') { S.review = S.review || []; S.showReview = true; }
  if (a === 'edit') S.showReview = false;
  if (a === 'cart') { S.showReview = true; S.view.buyer = 'new'; }
  if (a === 'more') S.moreOpen = true;
  if (a === 'moreclose' && e.target === b) S.moreOpen = false;
  if (a === 'gotoinv') { S.orderTab = 'invoices'; S.view.buyer = 'orders'; }
  if (a === 'cat') S.cat = v;
  if (a === 'attnf') S.attnFilter = v;
  if (a === 'step') { const l = L(id); l.qty = Math.max(1, l.qty + +d); }
  if (a === 'rm') { S.review = S.review.filter(l => l.id !== +id); if (S.addingLine === +id) { S.addingLine = null; S.draft = null; } }
  if (a === 'place') placeOrder();
  if (a === 'advance') advance(id, to);
  if (a === 'lowonly') S.lowOnly = !S.lowOnly;
  if (a === 'recv') S.receiving = id;
  if (a === 'recvcancel') S.receiving = null;
  if (a === 'recvsave') receive(id);
  if (a === 'addcat') addToCart(id);
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'chat-in') { e.preventDefault(); sendChat(S.chatText); } });
document.addEventListener('input', e => {
  const pf = e.target.dataset.pf; if (pf && S.pform) { S.pform[pf] = e.target.value; S.pform.err = ''; document.querySelector('.form-err')?.remove(); return; }
  const pb = e.target.dataset.pb; if (pb && S.problem) { S.problem[pb] = e.target.value; S.problem.err = ''; document.querySelector('.form-err')?.remove(); return; }
  const dr = e.target.dataset.dr; if (dr && S.draft) { S.draft[dr] = e.target.value; S.draft.err = ''; document.querySelector('.form-err')?.remove(); return; }
  const k = e.target.dataset.i; if (!k) return;
  S[k] = e.target.value; if (k === 'q') render();
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.c; if (!c) return;
  if (c === 'supplier') { S.supplierId = t.value; S.receiving = null; S.pform = null; }
  if (t.dataset.pb) return;
  if (c === 'setting') S.settings[t.dataset.key] = t.checked;
  if (c === 'budget') { const n = Number(t.value); if (n > 0) S.settings.budget = n; }
  if (c === 'have') { const n = Number(t.value); if (n >= 0) { S.usuals.find(u => u.pid === t.dataset.key).have = n; S.skipped = []; } }
  if (c === 'dsup') S.draft.sup = t.value;
  if (c === 'assign') S.assign[t.dataset.key] = t.value;
  if (c === 'pick') { const l = L(t.dataset.id); if (S.addingLine === l.id) { S.addingLine = null; S.draft = null; } if (t.value) { setProduct(l, t.value); if (l.state !== 'manual') l.state = 'ok'; } else l.pid = null; }
  if (c === 'qty') { const l = L(t.dataset.id), n = parseInt(t.value, 10); l.qty = Number.isInteger(n) && n > 0 ? n : 1; }
  if (c === 'add' && t.value) addToCart(t.value);
  render();
});
if (S.theme !== 'system') document.documentElement.dataset.theme = S.theme;
render();
</script>
